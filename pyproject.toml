[project]
name = "phone-ai-agent-team"
version = "2.0.0"
description = "16-agent AI software development automation for Android Termux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
phone-agent-team = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["config*", "orchestrator*", "agents*", "integrations*", "execution*", "memory*", "security*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:agents.*"]
