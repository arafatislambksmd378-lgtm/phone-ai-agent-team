name: Android emulator smoke
on: [push, pull_request]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 14 navigation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run_android_emulator_tests.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
      - name: Upload emulator screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android14-emulator-screenshots
          path: emulator-screenshots/*.png
          if-no-files-found: error
