name: Android APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Unit tests + assemble debug APK
        run: cd android && gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: android-build-reports, path: android/app/build/reports/ }
