name: Android APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests + assemble debug APK
        run: cd android && gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log
      - name: Verify APK exists
        run: ls -lh android/app/build/outputs/apk/debug/ && test -f android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-build-log, path: android-build.log }
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
