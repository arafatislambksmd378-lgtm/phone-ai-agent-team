name: Android APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests + assemble debug APK
        continue-on-error: true
        run: |
          cd android
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee ../android-build.log
      - name: Surface build errors
        if: always()
        run: |
          MSG=$(grep -A6 "What went wrong" android-build.log | head -12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::${MSG:-no error lines matched}"
          grep -q "BUILD SUCCESSFUL" android-build.log
      - name: Locate and stage APK
        run: |
          echo "::warning::$(grep -E 'BUILD (SUCCESSFUL|FAILED)' android-build.log | head -1)"
          echo "::warning::APKs found: $(find . -name '*.apk' | tr '\n' ' ')"
          mkdir -p apk-out
          find . -name "*.apk" -exec cp {} apk-out/ \;
          ls -lh apk-out/
          test -n "$(ls -A apk-out)"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apk-out/*.apk
