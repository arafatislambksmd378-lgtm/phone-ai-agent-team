name: Live Integration Verification (owner-authorized, manual)

# Manual only. Never runs on push/PR. Secrets are supplied by the owner through
# GitHub Settings -> Secrets and variables -> Actions. No credential is stored in Git.
on:
  # TEMPORARY branch-only trigger: GitHub only exposes workflow_dispatch for workflows
  # present on the default branch. This lets the same workflow run from PR #6's branch
  # without merging. Remove this block and the sentinel after the run.
  push:
    branches:
      - arena/3d5b512c-phone-ai-agent-team
    paths:
      - live-run-trigger
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to verify (only Gemini is enabled in this no-paid batch)'
        type: choice
        default: gemini
        options:
          - gemini
      free_tier_confirmed:
        description: 'I confirm this Gemini key/model incurs NO CHARGE for these checks'
        type: boolean
        default: false
      run_telegram:
        description: 'Run real Telegram Bot API checks (sends a few messages to your chat)'
        type: boolean
        default: true
      run_agent_build:
        description: 'Also run /build with live AI (slower, more calls; still requires no-charge confirmation)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write   # only to post redacted verification evidence on PR #6

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Owner-confirmed no-charge replacement for the retired gemini-2.0-flash.
      # A repository variable still wins if the owner sets one.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      RUN_LIVE_TESTS: '1'
      FREE_TIER_CONFIRMED: ${{ github.event_name == 'push' && 'true' || inputs.free_tier_confirmed }}
      RUN_TELEGRAM: ${{ github.event_name == 'push' && 'true' || inputs.run_telegram }}
      RUN_AGENT_BUILD: ${{ github.event_name == 'push' && 'false' || inputs.run_agent_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --quiet 'pytest>=8,<10'

      - name: Fail-closed credential preflight
        id: preflight
        run: python scripts/live_preflight.py

      - name: Local automated tests (baseline, no live calls)
        if: always()
        env:
          RUN_LIVE_TESTS: '0'
          GEMINI_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_ALLOWED_USER_ID: ''
        run: |
          mkdir -p live-evidence
          set -o pipefail
          python -m pytest tests/ -q -o addopts='' 2>&1 | tee live-evidence/local-tests.log

      - name: Real Gemini provider + real agent execution
        if: always()
        run: |
          set -o pipefail
          mkdir -p live-evidence
          python scripts/live_provider_check.py 2>&1 | tee live-evidence/provider-run.log

      - name: Real Telegram Bot + Android synchronization
        if: ${{ always() && (inputs.run_telegram || github.event_name == 'push') }}
        run: |
          set -o pipefail
          mkdir -p live-evidence
          python scripts/live_telegram_check.py 2>&1 | tee live-evidence/telegram-run.log

      - name: Opt-in live pytest subset
        if: always()
        run: |
          set -o pipefail
          if [ "$RUN_TELEGRAM" = "true" ]; then
            SELECTOR='gemini or telegram'
          else
            SELECTOR='gemini'
          fi
          python -m pytest tests/test_live_integrations.py -q -o addopts='' -k "$SELECTOR" 2>&1 | tee live-evidence/live-pytest.log

      - name: Publish redacted evidence
        if: always()
        run: |
          if [ -d live-evidence ]; then
            for f in live-evidence/*.md; do
              [ -f "$f" ] || continue
              echo "===== $f =====" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload redacted evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integration-evidence
          path: live-evidence/
          if-no-files-found: warn

      # TEMPORARY branch-run evidence mirror: the sandbox cannot download Actions
      # artifacts/logs (blob storage EOF), so publish only masked reports to PR #6.
      # Remove this step together with the temporary push trigger before merge.
      - name: Post redacted verification summary to PR #6
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Live integration evidence (redacted)"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Head: ${GITHUB_SHA}"
            for f in live-evidence/*.md; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              cat "$f"
            done
            echo "===== check summaries ====="
            grep -h '^RESULT:' live-evidence/*.log 2>/dev/null || true
            tail -n 2 live-evidence/local-tests.log 2>/dev/null || true
            tail -n 2 live-evidence/live-pytest.log 2>/dev/null || true
          } > /tmp/verification-summary.md
          gh pr comment 6 --body-file /tmp/verification-summary.md
