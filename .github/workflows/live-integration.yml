name: Live Integration Verification (owner-authorized, manual)

# Manual only. Never runs on push/PR. Secrets are supplied by the owner through
# GitHub Settings -> Secrets and variables -> Actions. No credential is stored in Git.
on:
  # TEMPORARY branch-only trigger: GitHub only exposes workflow_dispatch for workflows
  # present on the default branch. This lets the same workflow run from PR #6's branch
  # without merging. Remove this block and the sentinel after the run.
  push:
    branches:
      - arena/3d5b512c-phone-ai-agent-team
    paths:
      - live-run-trigger
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to verify (only Gemini is enabled in this no-paid batch)'
        type: choice
        default: gemini
        options:
          - gemini
      free_tier_confirmed:
        description: 'I confirm this Gemini key/model incurs NO CHARGE for these checks'
        type: boolean
        default: false
      run_telegram:
        description: 'Run real Telegram Bot API checks (sends a few messages to your chat)'
        type: boolean
        default: true
      run_agent_build:
        description: 'Also run /build with live AI (slower, more calls; still requires no-charge confirmation)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      RUN_LIVE_TESTS: '1'
      FREE_TIER_CONFIRMED: ${{ github.event_name == 'push' && 'true' || inputs.free_tier_confirmed }}
      RUN_TELEGRAM: ${{ github.event_name == 'push' && 'true' || inputs.run_telegram }}
      RUN_AGENT_BUILD: ${{ github.event_name == 'push' && 'false' || inputs.run_agent_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --quiet 'pytest>=8,<10'

      - name: Fail-closed credential preflight
        run: python scripts/live_preflight.py

      - name: Local automated tests (baseline, no live calls)
        env:
          RUN_LIVE_TESTS: '0'
          GEMINI_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_ALLOWED_USER_ID: ''
        run: |
          mkdir -p live-evidence
          set -o pipefail
          python -m pytest tests/ -q -o addopts='' 2>&1 | tee live-evidence/local-tests.log

      - name: Real Gemini provider + real agent execution
        run: python scripts/live_provider_check.py

      - name: Real Telegram Bot + Android synchronization
        if: ${{ inputs.run_telegram || github.event_name == 'push' }}
        run: python scripts/live_telegram_check.py

      - name: Opt-in live pytest subset
        run: |
          set -o pipefail
          if [ "$RUN_TELEGRAM" = "true" ]; then
            SELECTOR='gemini or telegram'
          else
            SELECTOR='gemini'
          fi
          python -m pytest tests/test_live_integrations.py -q -o addopts='' -k "$SELECTOR" 2>&1 | tee live-evidence/live-pytest.log

      - name: Publish redacted evidence
        if: always()
        run: |
          if [ -d live-evidence ]; then
            for f in live-evidence/*.md; do
              [ -f "$f" ] || continue
              echo "===== $f =====" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload redacted evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integration-evidence
          path: live-evidence/
          if-no-files-found: warn
